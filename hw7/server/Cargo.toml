[package]
name = "server"
version.workspace = true
edition.workspace = true

[dependencies]
api = { path = "../api" }
ticketing = { path = "../ticketing" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1"
serde = "1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
